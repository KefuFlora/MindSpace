<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MindSpace | Flagged Posts</title>

    <link
        rel="stylesheet"
        href="../css/moderator.css"
    >

</head>


<body>


    <!-- Navigation -->
    <header class="dashboard-header">

        <div class="brand">

            <h1>MindSpace</h1>

            <span>
                Moderator Portal
            </span>

        </div>


        <div class="header-actions">

            <button
                id="themeToggle"
                class="theme-toggle"
                type="button"
            >
                🌙 Dark Mode
            </button>


            <button
                id="logoutButton"
                class="logout-button"
                type="button"
            >
                Logout
            </button>

        </div>

    </header>



    <!-- Main Content -->
    <main class="dashboard-container">


        <!-- Page Heading -->
        <section class="welcome-section">

            <h2>
                Flagged Posts
            </h2>

            <p>
                Review posts that have been reported by students.
            </p>

        </section>



        <!-- Flagged Posts -->
        <section
            class="flagged-content-list"
            id="flaggedPostsContainer"
        >

            <!-- Posts will be loaded from the backend API -->

        </section>



        <!-- Back to Dashboard -->
        <div class="back-link-container">

            <a href="dashboard.html">
                ← Back to Dashboard
            </a>

        </div>


    </main>



    <!-- JavaScript -->
    <script src="../js/theme.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/flagged-post.js"></script>

</body>

</html>
