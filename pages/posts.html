
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academic Stress - MindSpace</title>

    <link rel="stylesheet" href="../css/posts.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>

<body>

    <main class="feed-screen">
<!-- Topic header -->
<header class="feed-header">
    <button class="back-button" id="backButton"
                aria-label="Go back">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path d="M25 5 L7 24 L25 43 M7 24 H43"
                        fill="none" stroke="currentColor"
                        stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round"/>
                </svg>
            </button>

    <h1>Academic Stress</h1>

    <a href="notifications.html" class="notifications-link"
       aria-label="Notifications">
        🔔 Notifications
    </a>

    <a href="profile.html" class="profile-link">
        👤 My Profile
    </a>

    <div class="theme-toggle-container">
        <input type="checkbox" id="themeToggle"
               aria-label="Toggle dark mode">

        <label for="themeToggle" class="theme-toggle-label">
            <span class="toggle-sun">☀</span>
            <span class="toggle-moon">☾</span>
            <span class="toggle-knob"></span>
        </label>
    </div>
</header>

<!-- Feed tabs: outside the header -->
<nav class="feed-tabs" aria-label="Feed options">
    <button class="tab-button active"
            data-feed="top" aria-pressed="true">
        Top
    </button>

    <button class="tab-button"
            data-feed="following" aria-pressed="false">
        Following
    </button>
</nav>

        <!-- Community posts -->
        <section class="feed-posts" id="postsList"
            aria-label="Community posts">
        </section>

        <!-- Floating create-post button -->
        <button class="create-post-button"
            id="createPostButton"
            aria-label="Create a post">
            <span aria-hidden="true">+</span>
        </button>

        <button type="button" id="logoutButton" class="logout-button">
         Logout
        </button>

    </main>
        <script src="../js/posts.js"></script>
        <script src="../js/auth.js"></script>
        <script src="../js/theme.js"></script>

</body>
</html>
